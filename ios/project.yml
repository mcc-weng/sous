name: Sous
options:
  bundleIdPrefix: com.mikeweng
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Sous:
    type: application
    platform: iOS
    sources: [Sous]
    dependencies:
      - package: Supabase
        product: Supabase
      - target: SousShareExtension
        embed: true
    entitlements:
      path: Sous/Sous.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.mikeweng.sous]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.mikeweng.sous.shared"]
        aps-environment: development
    info:
      path: Sous/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Sous
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeweng.sous
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9D37X3YV25
  SousShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - SousShareExtension
      - path: Sous/Config.swift
      - path: Sous/SupabaseClientFactory.swift
      - path: Sous/ShareIntakeLogic.swift
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: SousShareExtension/SousShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mikeweng.sous]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.mikeweng.sous.shared"]
    info:
      path: SousShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 小當家
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeweng.sous.SousShareExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9D37X3YV25
  SousTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SousTests]
    dependencies:
      - target: Sous
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sous:
    build:
      targets:
        Sous: all
    test:
      targets: [SousTests]
